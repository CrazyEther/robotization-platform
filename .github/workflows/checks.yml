name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run data:verify
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/simulation/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run jaamsim:install
      - run: npm run sim:test
      - name: Verify compute container and pinned professional engine
        run: |
          docker build -t ris-simulation:ci services/simulation
          docker run --rm ris-simulation:ci python -c "import app,jaamsim_engine; assert jaamsim_engine.installed_jar().is_file()"
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        env:
          RIS_WEB_PORT: '8890'
          RIS_SIM_PORT: '8900'
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:8890'
        run: |
          set -euo pipefail
          node scripts/start-ris.mjs > /tmp/ris-services.log 2>&1 &
          RIS_PID=$!
          trap 'kill "${RIS_PID}" 2>/dev/null || true; cat /tmp/ris-services.log' EXIT
          for attempt in $(seq 1 40); do
            if ! kill -0 "${RIS_PID}" 2>/dev/null; then
              echo "RIS processes terminated during startup"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8890/api/v1/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:8900/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8890/api/v1/health
          curl --fail --silent http://127.0.0.1:8900/health
          npm run test:e2e
